name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pytest pytest-asyncio pytest-cov ruff black mypy PyYAML croniter
          python -m pip install -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy tm/kstore tm/validate

      - name: Pytest
        run: python -m pytest -q

      - name: Run M1 demos (Linux only)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/validate_examples.sh
          scripts/validate_examples.sh
        shell: bash

  no-sqlite:
    name: tests (NO_SQLITE)
    runs-on: ubuntu-latest
    env:
      NO_SQLITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pytest pytest-asyncio pytest-cov PyYAML croniter
          python -m pip install -e .

      - name: Pytest
        run: python -m pytest -q

  daemon-smoke:
    name: daemon smoke (linux)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run daemon smoke script
        env:
          TM_ENABLE_DAEMON: "1"
          TM_FILE_QUEUE_V2: "1"
        run: |
          chmod +x scripts/daemon_smoke.sh
          scripts/daemon_smoke.sh
        shell: bash

  agent-bundle-smoke:
    name: agent bundle smoke
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,yaml]

      - name: Run bundle-specific tests
        run: python -m pytest tests/test_builtin_agents_v0.py tests/test_golden_agent_bundle_v0.py

      - name: Verify golden artifact
        run: tm artifacts verify specs/examples/agent_bundle_v0/agent_bundle_demo.yaml

      - name: Accept golden artifact
        run: |
          mkdir -p tmp/artifacts tmp/run
          tm artifacts accept specs/examples/agent_bundle_v0/agent_bundle_demo.yaml --out tmp/artifacts

      - name: Run golden bundle with guard denial
        run: |
          set -o pipefail
          tm run bundle tmp/artifacts/tm-agent-bundle-demo.yaml \
            --inputs artifact:http_request='{"method":"GET","url":"https://example.com/api/demo"}' \
            --report tmp/run/report.json --json || true

      - name: Validate run report
        run: |
          python - <<'PY'
import json
from pathlib import Path

report = json.loads(Path("tmp/run/report.json").read_text(encoding="utf-8"))
assert report["error"] is not None
assert report["success"] is False
assert report["policy_decisions"]
assert any(not decision.get("allowed", True) for decision in report["policy_decisions"])
PY
