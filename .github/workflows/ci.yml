name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov ruff black mypy PyYAML croniter
          python -m pip install -e .

      - name: Run pytest with timeout/fallback
        shell: bash
        run: |
          set +e
          timeout 10m python -m pytest -q
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "pytest full timed out; running critical subset"
            timeout 10m python -m pytest -q \
              tests/test_policy_engine_deterministic.py \
              tests/test_gate_runner.py \
              tests/cli/test_cli_help_no_networkx.py \
              tests/test_gate_proposal_cli.py \
              tests/test_ci_gate_cli.py
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

  gate-proposals:
    name: gate proposals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run proposal gate scan
        shell: bash
        run: timeout 10m python -m tm ci gate

  lint-and-test:
    name: tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pytest pytest-asyncio pytest-cov ruff black mypy PyYAML croniter
          python -m pip install -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy tm/kstore tm/validate

      - name: Pytest gate (critical)
        shell: bash
        run: |
          if command -v timeout >/dev/null 2>&1; then
            timeout 10m python -m pytest -q \
              tests/test_policy_engine_deterministic.py \
              tests/test_gate_runner.py \
              tests/cli/test_cli_help_no_networkx.py
          else
            python -m pytest -q \
              tests/test_policy_engine_deterministic.py \
              tests/test_gate_runner.py \
              tests/cli/test_cli_help_no_networkx.py
          fi

      - name: Pytest full
        shell: bash
        run: |
          if command -v timeout >/dev/null 2>&1; then
            timeout 10m python -m pytest -q
          else
            python -m pytest -q
          fi

      - name: Run M1 demos (Linux only)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/validate_examples.sh
          scripts/validate_examples.sh
        shell: bash

  no-sqlite:
    name: tests (NO_SQLITE)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_SQLITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pytest pytest-asyncio pytest-cov PyYAML croniter
          python -m pip install -e .

      - name: Pytest gate (critical)
        shell: bash
        run: timeout 10m python -m pytest -q tests/test_policy_engine_deterministic.py tests/test_gate_runner.py tests/cli/test_cli_help_no_networkx.py

      - name: Pytest full
        shell: bash
        run: timeout 10m python -m pytest -q

  daemon-smoke:
    name: daemon smoke (linux)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run daemon smoke script
        env:
          TM_ENABLE_DAEMON: "1"
          TM_FILE_QUEUE_V2: "1"
        run: |
          chmod +x scripts/daemon_smoke.sh
          scripts/daemon_smoke.sh
        shell: bash

  agent-bundle-smoke:
    name: agent bundle smoke
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,yaml]

      - name: Run bundle-specific tests
        run: python -m pytest tests/test_builtin_agents_v0.py tests/test_golden_agent_bundle_v0.py

      - name: Verify golden artifact
        run: tm artifacts verify specs/examples/agent_bundle_v0/agent_bundle_demo.yaml

      - name: Accept golden artifact
        run: |
          mkdir -p tmp/artifacts tmp/run
          tm artifacts accept specs/examples/agent_bundle_v0/agent_bundle_demo.yaml --out tmp/artifacts

      - name: Run golden bundle with guard denial
        run: |
          set -o pipefail
          tm run bundle tmp/artifacts/tm-agent-bundle-demo.yaml \
            --inputs artifact:http_request='{"method":"GET","url":"https://example.com/api/demo"}' \
            --report tmp/run/report.json --json || true

      - name: Validate run report
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("tmp/run/report.json").read_text(encoding="utf-8"))
          try:
              assert report.get("success") is False, "expected success=False (guard denial or run failure)"
              assert report.get("error") is not None, "expected error to be set"
              decisions = report.get("policy_decisions") or []
              if decisions:
                  assert any(not decision.get("allowed", True) for decision in decisions), (
                      "expected at least one policy_guard with allowed=False"
                  )
          except AssertionError as e:
              print("Validate run report failed:", e, file=sys.stderr)
              print("report.success =", report.get("success"), file=sys.stderr)
              print("report.error =", report.get("error"), file=sys.stderr)
              print("report.policy_decisions =", json.dumps(report.get("policy_decisions"), indent=2), file=sys.stderr)
              raise
          PY
